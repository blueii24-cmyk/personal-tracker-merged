# Minimal Supabase CLI config for this repo. Create a real project with `supabase link`; this file only carries per-function settings.
# google-calendar: the Google redirect (GET /callback) has no Supabase JWT, so the platform JWT check is off for this function.
# EVERY other request is authenticated inside the function by validating the caller's Supabase JWT (see index.ts: authenticate()).
[functions.google-calendar]
verify_jwt = false

# Default AI accepts only POSTs and also resolves the user inside the function.
# Unlike Google Calendar it has no unauthenticated OAuth callback.
[functions.ai-chat]
verify_jwt = true
