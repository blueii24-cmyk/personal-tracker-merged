name: Build Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'components.json'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'components.json'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android artifact to build (release and bundle require signing secrets)'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
          - bundle

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  ANDROID_BUILD_MODE: ${{ inputs.build_type || 'debug' }}
  # Public project configuration must be explicitly supplied as repository variables.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_AUTH_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_AUTH_REDIRECT_URL || 'https://personal-tracker-merged.vercel.app' }}

jobs:
  android:
    name: Android package and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate required configuration without exposing values
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-ci.mjs preflight

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Typecheck, lint, and test
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npx vitest run

      - name: Restore temporary upload signing configuration
        if: env.ANDROID_BUILD_MODE != 'debug'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/personal-tracker-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Export web assets and build Android package
        shell: bash
        run: node scripts/android.mjs "$ANDROID_BUILD_MODE"

      - name: Verify package, signature, application ID, and packaged configuration
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          asset_dir="$RUNNER_TEMP/android-package-assets"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"

          if [[ "$ANDROID_BUILD_MODE" == 'bundle' ]]; then
            packages=(android/app/build/outputs/bundle/release/*.aab)
            if (( ${#packages[@]} != 1 )); then
              echo 'Expected exactly one signed release AAB.'
              exit 1
            fi
            package="${packages[0]}"
            jarsigner -verify -strict "$package"
            unzip -q "$package" 'base/assets/public/*' -d "$asset_dir"
            node scripts/android-ci.mjs verify-assets "$asset_dir/base/assets/public"
            artifact_name='Personal-Tracker-Play-AAB'
          else
            packages=("android/app/build/outputs/apk/$ANDROID_BUILD_MODE/"*.apk)
            if (( ${#packages[@]} != 1 )); then
              echo "Expected exactly one $ANDROID_BUILD_MODE APK."
              exit 1
            fi
            package="${packages[0]}"
            "$build_tools/apksigner" verify "$package"
            badging="$("$build_tools/aapt" dump badging "$package")"
            if ! grep -q "package: name='com.blueii24.personaltracker'" <<<"$badging"; then
              echo 'The APK application ID changed unexpectedly.'
              exit 1
            fi
            if ! grep -q "application-label:'Personal Tracker'" <<<"$badging"; then
              echo 'The APK launcher label changed unexpectedly.'
              exit 1
            fi
            echo 'Compiled Android activity manifest:'
            "$build_tools/aapt" dump xmltree "$package" AndroidManifest.xml | tee "$RUNNER_TEMP/android-manifest.txt"
            echo 'Compiled activity/launcher theme resources:'
            "$build_tools/aapt" dump resources "$package" > "$RUNNER_TEMP/android-resources-all.txt"
            grep -E 'AppTheme|title_activity_main|app_name' "$RUNNER_TEMP/android-resources-all.txt" | tee "$RUNNER_TEMP/android-resources.txt"
            echo "::notice::Compiled APK manifest activity: $(grep -A12 'E: activity ' "$RUNNER_TEMP/android-manifest.txt" | head -13 | tr '\n' ' ')"
            echo "::notice::Compiled APK theme/label resources: $(tr '\n' ' ' < "$RUNNER_TEMP/android-resources.txt")"
            echo "::notice::Compiled splash style bag: $(grep -A12 'style/AppTheme.NoActionBarLaunch: <bag>' "$RUNNER_TEMP/android-resources-all.txt" | tr '\n' ' ')"
            echo "::notice::Compiled no-action-bar style bag: $(grep -A12 'style/AppTheme.NoActionBar: <bag>' "$RUNNER_TEMP/android-resources-all.txt" | tr '\n' ' ')"
            unzip -q "$package" 'assets/public/*' -d "$asset_dir"
            node scripts/android-ci.mjs verify-assets "$asset_dir/assets/public"
            if [[ "$ANDROID_BUILD_MODE" == 'release' ]]; then
              artifact_name='Personal-Tracker-Signed-Release-APK'
            else
              artifact_name='Personal-Tracker-Debug-APK'
            fi
          fi

          test -s "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload verified Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing and extracted package files
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties
          rm -f "$RUNNER_TEMP/personal-tracker-upload.jks"
          rm -rf "$RUNNER_TEMP/android-package-assets"

  android-runtime:
    name: Android emulator UI smoke test
    needs: android
    if: ${{ (inputs.build_type || 'debug') == 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download the built debug APK
        uses: actions/download-artifact@v4
        with:
          name: Personal-Tracker-Debug-APK
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the app and IME on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_APK: apk/app-debug.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 scripts/android-ui-smoke.py
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-UI-Evidence
          path: ${{ runner.temp }}/android-ui-evidence
          if-no-files-found: warn
          retention-days: 14
