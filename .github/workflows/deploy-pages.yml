name: Deploy Personal Tracker to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Pages only serves static files. Keep the API implementation in
      # the repository, but omit its route handlers from this static-only build.
      - name: Prepare static-only build
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api "$RUNNER_TEMP/personal-tracker-api"
          fi

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BACKEND_MODE: "demo"

      - name: Verify exported pages
        run: |
          test -f out/index.html
          test -f out/chat/index.html
          test -f out/bulking/index.html
          test -f out/budget/index.html
          test -f out/history/index.html
          test -f out/settings/index.html
          touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
